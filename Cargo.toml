[package]
name = "file-service"
version = "0.1.0"
edition = "2024"

[dependencies]
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
    "fmt",
    "time",
] }
tracing-appender = "0.2"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["macros"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
thiserror = "2"
toolcraft-axum-kit = {version = "0.2.10"}
toolcraft-jwt= {version = "0.3.6"}
toolcraft-request= {version = "0.2.3"}
toolcraft-utils= {version = "0.2.2"}
toolcraft-config= {version = "0.2.0"}
reqwest = "0.12"
uuid = { version = "1", features = ["v4"] }
