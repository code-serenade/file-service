[http]
port = 29002

[jwt_verify]
url = "http://10.100.11.246:29001/internal/jwt_verify_config"
header = "x-internal-token"
token = "dev-internal-token-change-me"

[storage]
user_key_salt = "please-change-to-random-long-string"

[s3]
# Shared connection settings apply to all buckets unless a bucket overrides them.
provider = "s3"
addressing_style = "path"
endpoint = "http://127.0.0.1:9000"
internal_endpoint = "http://127.0.0.1:9000"
region = "us-east-1"
# Copy config/keys-example.toml to config/keys.toml for shared credentials.

[[s3.buckets]]
id = "avatar"
bucket = "test-avatars"
read_policy = "private"
key_prefix = "avatars"

[[s3.buckets]]
id = "image"
bucket = "test-images"
read_policy = "private"
key_prefix = "users"

[[s3.buckets]]
id = "document"
bucket = "test-documents"
read_policy = "private"
key_prefix = "users"

[[s3.buckets]]
id = "media"
bucket = "test-media"
read_policy = "private"
key_prefix = "users"
